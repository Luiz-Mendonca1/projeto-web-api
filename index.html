<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Catálogo de produtos interativo consumindo FakeStoreAPI">
  <title>DevStore | Catálogo de Produtos</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="header">
    <div class="container header-content">
      <h1>DevStore</h1>
      <p>Catálogo dinâmico com consumo de API REST</p>
    </div>
  </header>

  <main class="container">
    <!-- Seção de Filtros e Busca -->
    <section class="controls" aria-label="Filtros de busca">
      <div class="search-box">
        <label for="search-input">Buscar produto:</label>
        <input 
          type="search" 
          id="search-input" 
          placeholder="Ex: mochila, monitor, jaqueta..." 
          aria-label="Buscar produto pelo nome"
        >
      </div>

      <nav class="category-filters" aria-label="Filtrar por categoria">
        <button type="button" class="filter-btn active" data-category="all">Todos</button>
        <button type="button" class="filter-btn" data-category="electronics">Eletrônicos</button>
        <button type="button" class="filter-btn" data-category="jewelery">Acessórios</button>
        <button type="button" class="filter-btn" data-category="men's clothing">Moda Masculina</button>
        <button type="button" class="filter-btn" data-category="women's clothing">Moda Feminina</button>
      </nav>
    </section>

    <!-- Feedback de Carregamento (Loading) -->
    <div id="loading" class="status-message" role="status" aria-live="polite">
      <div class="spinner" aria-hidden="true"></div>
      <p>Carregando produtos...</p>
    </div>

    <!-- Feedback de Erro -->
    <div id="error-container" class="status-message error hidden" role="alert" aria-live="assertive">
      <p id="error-message">Ocorreu um erro ao carregar os dados.</p>
      <button type="button" id="retry-btn" class="btn-retry">Tentar novamente</button>
    </div>

    <!-- Grid de Produtos -->
    <section aria-label="Lista de produtos">
      <div id="products-grid" class="products-grid"></div>
    </section>
  </main>

  <footer class="footer">
    <div class="container">
      <p>Desenvolvido por <strong>Luiz Eduardo Alves Mendonça</strong> &copy; 2026</p>
    </div>
  </footer>

  <!-- Script principal como Módulo ES6 -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
